name: Build macOS Application

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
            name: Intel
            script: package-mac-intel
            folder: "Medipol Video Bot-darwin-x64"
            artifact: Medipol_Video_Bot_macOS_Intel
          - os: macos-14
            arch: arm64
            name: Silicon
            script: package-mac-silicon
            folder: "Medipol Video Bot-darwin-arm64"
            artifact: Medipol_Video_Bot_macOS_Silicon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd system
          npm install

      - name: Package macOS App
        run: |
          cd system
          npm run ${{ matrix.script }}

      - name: Zip macOS App Bundle
        run: |
          cd "build/${{ matrix.folder }}"
          zip -r ../../${{ matrix.artifact }}.zip "Medipol Video Bot.app"

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
